version: '3.8'

services:
  backend:
    build:
      context: ./django_wellness
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./react_wellness
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"  # Map host port 3000 to container port 80 (Nginx)
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: wellness_db
      POSTGRES_USER: wellness_user
      POSTGRES_PASSWORD: wellness_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
